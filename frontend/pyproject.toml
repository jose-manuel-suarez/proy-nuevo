[project]
name = "frontend"
version = "0.1.0"
description = "Server-rendered frontend for proy-nuevo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask==3.1.0",
    "gunicorn==23.0.0; sys_platform != 'win32'",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic-settings==2.9.1",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.11.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

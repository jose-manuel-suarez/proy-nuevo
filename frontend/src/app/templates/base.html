<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}proy-nuevo{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <span class="brand">proy-nuevo</span>
      <span class="tagline">FastAPI behind Flask, rendered on the server</span>
    </header>
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <span>Every asset is served locally; no third-party runtime dependency.</span>
    </footer>
  </body>
</html>

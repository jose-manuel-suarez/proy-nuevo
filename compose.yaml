name: proy-nuevo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - internal

  backend:
    image: ghcr.io/${GHCR_OWNER:-local}/${GHCR_REPO:-proy-nuevo}-backend:${IMAGE_TAG:-dev}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  frontend:
    image: ghcr.io/${GHCR_OWNER:-local}/${GHCR_REPO:-proy-nuevo}-frontend:${IMAGE_TAG:-dev}
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-5}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2.9-alpine
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge

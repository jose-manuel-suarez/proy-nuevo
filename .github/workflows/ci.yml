name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/**"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            smoke:
              - 'backend/**'
              - 'frontend/**'
              - 'compose*.yaml'
              - 'infra/**'
              - '.github/workflows/ci.yml'

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate head branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^feature/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch '$HEAD_REF' must match feature/<kebab-case-change-name>"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            frontend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install frontend dependencies
        working-directory: frontend
        run: uv sync --frozen
      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .
      - name: Lint frontend
        working-directory: frontend
        run: uv run ruff check .
      - name: Check formatting
        run: |
          (cd backend && uv run ruff format --check .)
          (cd frontend && uv run ruff format --check .)

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            frontend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install frontend dependencies
        working-directory: frontend
        run: uv sync --frozen
      - name: Type-check backend
        working-directory: backend
        run: uv run mypy src
      - name: Type-check frontend
        working-directory: frontend
        run: uv run mypy src

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: frontend/uv.lock
      - name: Install dependencies
        working-directory: frontend
        run: uv sync --frozen
      - name: Run frontend tests
        working-directory: frontend
        run: uv run pytest

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Apply migrations from an empty database
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Check for model drift
        working-directory: backend
        run: uv run alembic check

  images:
    name: images (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            dockerfile: backend/Dockerfile
          - service: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: proy-nuevo-${{ matrix.service }}:ci

  smoke:
    needs: [changes, images]
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.dev.yaml up -d --build --wait
      - name: Assert the rendered page
        run: |
          curl --fail --silent --show-error http://localhost:8080/ | grep -q "Service status"
          curl --fail --silent --show-error http://localhost:8080/readyz
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.dev.yaml down -v

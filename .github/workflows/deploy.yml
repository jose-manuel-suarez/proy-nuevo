name: deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA of the merged release
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: sha-${{ inputs.image_tag }}
      GHCR_OWNER: ${{ github.repository_owner }}
      GHCR_REPO: ${{ github.event.repository.name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/proy-nuevo' }}
      DOMAIN: ${{ vars.DOMAIN }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'app' }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER || 'app' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deployment secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DB_PASSWORD SERVICE_TOKEN SESSION_SECRET DOMAIN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::missing required secret or variable: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-backend:${{ env.IMAGE_TAG }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-frontend:${{ env.IMAGE_TAG }}

      - name: Prepare the runtime environment file
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          umask 077
          cat > .env.incoming <<EOF
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${DB_PASSWORD}
          DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
          APP_ENV=production
          LOG_LEVEL=INFO
          SERVICE_TOKEN=${SERVICE_TOKEN}
          BACKEND_URL=http://backend:8000
          REQUEST_TIMEOUT=5
          SECRET_KEY=${SESSION_SECRET}
          DOMAIN=${DOMAIN}
          GHCR_OWNER=${GHCR_OWNER}
          GHCR_REPO=${GHCR_REPO}
          IMAGE_TAG=${IMAGE_TAG}
          EOF
          chmod 600 .env.incoming

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin the host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy release files to the host
        run: |
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR/infra'"
          scp compose.yaml compose.prod.yaml .env.incoming "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"
          scp -r infra/. "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/infra/"

      - name: Bootstrap and deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_DIR' && DEPLOY_DIR='$DEPLOY_DIR' ./infra/host-bootstrap.sh && \
             DEPLOY_DIR='$DEPLOY_DIR' IMAGE_TAG='$IMAGE_TAG' GHCR_OWNER='$GHCR_OWNER' \
             GHCR_REPO='$GHCR_REPO' DOMAIN='$DOMAIN' GHCR_TOKEN='$GHCR_TOKEN' ./infra/deploy.sh"
